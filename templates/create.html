<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {{template "navbar" .User}}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Add New Student</h5>
                    </div>
                    <div class="card-body">
                        {{if .Error}}
                        <div class="alert alert-danger">{{.Error}}</div>
                        {{end}}

                        <form name="studentForm" method="POST" action="/create"
                              onsubmit="return validateForm()">

                            <div class="mb-3">
                                <label for="nim" class="form-label">NIM</label>
                                <input type="text" class="form-control"
                                       id="nim" name="nim"
                                       value="{{.Student.NIM}}" required>

                                <div id="nimError" class="text-danger mt-1"
                                     style="display: none; font-size: 0.875em;">
                                    NIM must be a valid number!
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control"
                                       id="name" name="name"
                                       value="{{.Student.Name}}" required>
                            </div>

                            <div class="mb-4">
                                <label for="major_id" class="form-label">Major</label>
                                <select class="form-select"
                                        id="major_id" name="major_id" required>
                                    <option value="" disabled
                                        {{if eq .Student.MajorID 0}}selected{{end}}>
                                        Select Major...
                                    </option>

                                    {{range .Majors}}
                                    <option value="{{.ID}}"
                                        {{if eq .ID $.Student.MajorID}}selected{{end}}>
                                        {{.Name}}
                                    </option>
                                    {{end}}
                                </select>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">
                                    Save Data
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validateForm() {
            let nim = document.forms["studentForm"]["nim"].value;
            let nimError = document.getElementById("nimError");
            let nimInput = document.getElementById("nim");

            if (!/^[0-9]+$/.test(nim)) {
                nimError.style.display = "block";
                nimInput.classList.add("is-invalid");
                return false;
            }

            nimError.style.display = "none";
            nimInput.classList.remove("is-invalid");
            return true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
