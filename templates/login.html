<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center" style="margin-top: 15vh;">
            <div class="col-md-4">

                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white text-center">
                        <h5 class="mb-0">Student Management Login</h5>
                    </div>

                    <div class="card-body">

                        {{if .Error}}
                        <div class="alert alert-danger py-2">
                            {{.Error}}
                        </div>
                        {{end}}

                        <form method="POST" action="/login">

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">
                                    Login
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
